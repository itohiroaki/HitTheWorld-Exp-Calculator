<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HIT : The World EXP Calculator</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="container">

    <h1>HIT : The World</h1>

    <h2>EXP Calculator</h2>

    <p class="description">
        経験値テーブルをもとに、目標レベルまでの必要時間を計算します。
    </p>

    <hr>


    <!-- ==========================
         入力
    =========================== -->

    <section class="calculator">

        <h3>計算条件</h3>


        <div class="form-group">

            <label for="currentLevel">
                現在レベル
            </label>

            <input
                type="number"
                id="currentLevel"
                min="1"
                max="99"
                value="88"
            >

        </div>


        <div class="form-group">

            <label for="currentExp">
                現在の経験値
            </label>

            <div class="input-with-unit">

                <input
                    type="number"
                    id="currentExp"
                    min="0"
                    max="99.9999"
                    step="0.01"
                    value="10"
                >

                <span>%</span>

            </div>

        </div>


        <div class="form-group">

            <label for="targetLevel">
                目標レベル
            </label>

            <input
                type="number"
                id="targetLevel"
                min="1"
                max="99"
                value="89"
            >

        </div>


        <div class="form-group">

            <label for="expPerHour">
                1時間あたりの経験値
            </label>

            <div class="input-with-unit">

                <input
                    type="number"
                    id="expPerHour"
                    min="0"
                    step="0.01"
                    value="1.38"
                >

                <span>% / 時間</span>

            </div>

        </div>


        <div class="form-group">

            <label for="hoursPerDay">
                1日の狩り時間
            </label>

            <div class="input-with-unit">

                <input
                    type="number"
                    id="hoursPerDay"
                    min="0.1"
                    max="24"
                    step="0.1"
                    value="24"
                >

                <span>時間 / 日</span>

            </div>

        </div>


        <div class="form-group">

            <label for="targetDate">
                目標日
            </label>

            <input
                type="date"
                id="targetDate"
                value="2026-09-30"
            >

        </div>


        <button id="calculateButton">
            計算する
        </button>

    </section>


    <!-- ==========================
         結果
    =========================== -->

    <section
        id="result"
        class="result"
        hidden
    >

        <h3>計算結果</h3>

        <div id="resultContent"></div>

    </section>


    <!-- ==========================
         データ状態
    =========================== -->

    <section class="data-status">

        <h3>経験値データ</h3>

        <p id="dataStatus">
            読み込み中...
        </p>

    </section>

</main>


<script src="js/app.js"></script>

</body>

</html>
