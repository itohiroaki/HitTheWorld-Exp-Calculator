<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HIT : The World EXP Calculator</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main class="container">

    <h1>HIT : The World</h1>

    <h2>EXP Calculator</h2>

    <p class="description">
        経験値テーブルをもとに、目標レベルまでの必要時間を計算します。
    </p>

    <hr>


    <!-- ==========================
         計算条件
    =========================== -->

    <section class="calculator">

        <h3>計算条件</h3>


        <div class="form-group">

            <label for="currentLevel">
                現在レベル
            </label>

            <input
                type="number"
                id="currentLevel"
                min="1"
                max="99"
            >

        </div>


        <div class="form-group">

            <label for="currentExp">
                現在の経験値
            </label>

            <div class="input-with-unit">

                <input
                    type="number"
                    id="currentExp"
                    min="0"
                    max="99.9999"
                    step="0.01"
                >

                <span>%</span>

            </div>

        </div>


        <div class="form-group">

            <label for="targetLevel">
                目標レベル
            </label>

            <input
                type="number"
                id="targetLevel"
                min="1"
                max="99"
            >

        </div>


        <div class="form-group">

            <label for="expPerHour">
                現在の狩り効率
            </label>

            <div class="input-with-unit">

                <input
                    type="number"
                    id="expPerHour"
                    min="0"
                    step="0.01"
                >

                <span>% / 時間</span>

            </div>

            <p class="input-note">
                現在のレベルで1時間に増える経験値を入力してください。
            </p>

        </div>


        <div class="form-group">

            <label for="hoursPerDay">
                1日の狩り時間
            </label>

            <div class="input-with-unit">

                <input
                    type="number"
                    id="hoursPerDay"
                    min="0.1"
                    max="24"
                    step="0.1"
                >

                <span>時間 / 日</span>

            </div>

        </div>


        <div class="form-group">

            <label for="targetDate">
                目標日
            </label>

            <input
                type="date"
                id="targetDate"
            >

        </div>


        <button id="calculateButton">
            計算する
        </button>

    </section>


    <!-- ==========================
         計算結果
    =========================== -->

    <section
        id="result"
        class="result"
        hidden
    >

        <h3>計算結果</h3>

        <div id="resultContent"></div>

    </section>


<!-- ==========================
     目標日までの到達予測
=========================== -->

<section
    id="futureLevel"
    class="result"
    hidden
>

    <h3>目標日までの到達予測</h3>

    <p class="input-note">
        レベルアップによる経験値効率の変化を考慮したシミュレーションです。
    </p>

    <div class="future-level-result">

        <div class="future-level-label">
            目標日
        </div>

        <div
            id="futureTargetDate"
            class="future-target-date"
        >
        </div>


        <div class="future-level-label">
            予想到達レベル
        </div>

        <div
            id="futureMaxLevel"
            class="future-max-level"
        >
        </div>


        <div
            id="futureLevelStatus"
            class="future-level-status"
        >
        </div>


        <div class="future-level-label">
            目標日までに獲得可能な経験値
        </div>

        <div
            id="futureAvailableExp"
            class="future-available-exp"
        >
        </div>

    </div>

</section>

<!-- ==========================
     到達レベル別一覧
=========================== -->

<section
    id="levelSummary"
    class="result"
    hidden
>

    <h3>到達レベル別一覧</h3>

    <p class="input-note">
        現在の実EXP効率を維持した場合の到達予測です。
    </p>

    <div class="table-wrapper">

        <table class="level-table">

            <thead>

                <tr>

                    <th>目標レベル</th>
                    <th>必要EXP</th>
                    <th>必要時間</th>
                    <th>必要日数</th>
                    <th>到達予定日</th>
                    <th>目標日</th>

                </tr>

            </thead>

            <tbody id="levelSummaryBody">

            </tbody>

        </table>

    </div>

</section>


    <!-- ==========================
         経験値データ
    =========================== -->

    <section class="data-status">

        <h3>経験値データ</h3>

        <p id="dataStatus">
            読み込み中...
        </p>

    </section>

</main>


<script src="js/app.js"></script>

</body>

</html>
